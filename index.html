        // --- AUTHENTICATION CONTROLLER ---
        function fillLogin(u, p) {
            document.getElementById('loginUser').value = u;
            document.getElementById('loginPass').value = p;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const found = db.users.find(x => x.username === u && x.pass === p);
            
            if(found) {
                db.currentUser = found;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                initApp();
            } else {
                const err = document.getElementById('loginError');
                err.textContent = 'Invalid username or password. Please check your credentials.';
                err.classList.remove('hidden');
            }
        }

        function logout() {
            db.currentUser = null;
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            document.getElementById('loginError').classList.add('hidden');
        }

        // --- CORE COMPUTATION ENGINE & TEST CASE ---
        function computeStudentGradeForSubject(studentId, subjectName, termNo) {
            const subObj = db.subjects.find(s => s.name === subjectName);
            // Weights: 20/50/30 or 20/60/20 based on subject group
            let wwWeight = 0.20, ptWeight = 0.50, exWeight = 0.30;
            if(subObj && subObj.weightGroup.includes('Tech-Voc')) {
                wwWeight = 0.20; ptWeight = 0.60; exWeight = 0.20;
            }

            // Get activities for this subject & term
            const acts = db.activities.filter(a => a.subject === subjectName && a.term === termNo);
            let wwEarned = 0, wwTotal = 0;
            let ptEarned = 0, ptTotal = 0;
            let st1Earned = 0, st1Total = 50;
            let st2Earned = 0, st2Total = 50;
            let termExamEarned = 0, termExamTotal = 50;

            let st1Obj = null, st2Obj = null, termExamObj = null;

            acts.forEach(act => {
                const key = `${act.id}_${studentId}`;
                const scoreData = db.scores[key] || { score: 0, status: 'scored' };
                if(scoreData.status === 'excused') return; // Excluded

                const val = scoreData.status === 'missing' ? 0 : parseFloat(scoreData.score || 0);
                const max = act.highestScore;

                if(act.component === 'WW') {
                    wwEarned += val; wwTotal += max;
                } else if(act.component === 'PT') {
                    ptEarned += val; ptTotal += max;
                } else if(act.component === 'EX') {
                    if(act.type === 'Summative Test 1') { st1Earned = val; st1Total = max; }
                    else if(act.type === 'Summative Test 2') { st2Earned = val; st2Total = max; }
                    else if(act.type === 'Term Examination') { termExamEarned = val; termExamTotal = max; }
                }
            });

            const wwPS = wwTotal > 0 ? (wwEarned / wwTotal) * 100 : 0;
            const ptPS = ptTotal > 0 ? (ptEarned / ptTotal) * 100 : 0;
            
            const st1PS = st1Total > 0 ? (st1Earned / st1Total) * 100 : 0;
            const st2PS = st2Total > 0 ? (st2Earned / st2Total) * 100 : 0;
            const termExamPS = termExamTotal > 0 ? (termExamEarned / termExamTotal) * 100 : 0;

            // Examinations component formula: ST1 PS x 0.30 + ST2 PS x 0.30 + Term Exam PS x 0.40
            const exPS = (st1PS * 0.30) + (st2PS * 0.30) + (termExamPS * 0.40);

            const wsWW = wwPS * wwWeight;
            const wsPT = ptPS * ptWeight;
            const wsEX = exPS * exWeight;

            const initialGrade = wsWW + wsPT + wsEX;
            const termGrade = transmuteGrade(initialGrade, db.gradingRulesActive);
            const descriptor = getDescriptor(termGrade);

            return {
                wwPS: wwPS.toFixed(2),
                ptPS: ptPS.toFixed(2),
                exPS: exPS.toFixed(2),
                wsWW: wsWW.toFixed(2),
                wsPT: wsPT.toFixed(2),
                wsEX: wsEX.toFixed(2),
                initialGrade: initialGrade.toFixed(2),
                termGrade: termGrade,
                descriptor: descriptor
            };
        }

        function transmuteGrade(ig, active) {
            if(!active) {
                // Zero-based mode
                return Math.max(60, Math.round(ig));
            }
            // Transmutation table mapping (IG range -> Term Grade)
            if (ig >= 99.50) return 100;
            if (ig >= 98.32) return 99;
            if (ig >= 97.14) return 98;
            if (ig >= 95.96) return 97;
            if (ig >= 94.78) return 96;
            if (ig >= 93.60) return 95;
            if (ig >= 92.42) return 94;
            if (ig >= 91.24) return 93;
            if (ig >= 90.06) return 92;
            if (ig >= 88.88) return 91;
            if (ig >= 87.70) return 90;
            if (ig >= 86.52) return 89;
            if (ig >= 85.34) return 88;
            if (ig >= 84.16) return 87;
            if (ig >= 82.98) return 86;
            if (ig >= 81.80) return 85;
            if (ig >= 80.62) return 84;
            if (ig >= 79.44) return 83;
            if (ig >= 78.26) return 82;
            if (ig >= 77.08) return 81;
            if (ig >= 75.90) return 80;
            if (ig >= 74.72) return 79;
            if (ig >= 73.54) return 78;
            if (ig >= 72.36) return 77;
            if (ig >= 71.18) return 76;
            if (ig >= 70.00) return 75;
            if (ig >= 65.34) return 74;
            if (ig >= 60.67) return 73;
            if (ig >= 56.01) return 72;
            if (ig >= 51.34) return 71;
            if (ig >= 46.67) return 70;
            if (ig >= 42.01) return 69;
            if (ig >= 37.34) return 68;
            if (ig >= 32.68) return 67;
            if (ig >= 28.01) return 66;
            if (ig >= 23.35) return 65;
            if (ig >= 18.68) return 64;
            if (ig >= 14.01) return 63;
            if (ig >= 9.35) return 62;
            if (ig >= 4.68) return 61;
            return 60;
        }

        function getDescriptor(g) {
            if (g >= 90) return 'Advancing';
            if (g >= 80) return 'Benchmarking';
            if (g >= 75) return 'Connecting';
            if (g >= 65) return 'Developing';
            return 'Emerging';
        }

            db.auditLogs.unshift({ time: new Date().toISOString().replace('T', ' ').substring(0, 16), user: db.currentUser.username, action: `Updated score for activity ${actId}, student ${stId} to ${val}` });

            if(!db.scores[key]) db.scores[key] = { score: 0, status: 'scored' };

                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Event Type</label>
                            <select id="evType" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                                <option value="exam week">Exam Week</option>
                                <option value="grade submission deadline">Grade Submission Deadline</option>
                                <option value="school program">School Program</option>
                                <option value="holiday">Holiday</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Audience</label>
                            <select id="evAudience" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                                <option value="all">All Users</option>
                                <option value="teachers">Teachers & Advisers</option>
                                <option value="students">Students Only</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Start Date</label>
                            <input type="date" id="evStart" required class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">End Date</label>
                            <input type="date" id="evEnd" required class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Description</label>
                        <textarea id="evDesc" rows="3" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50" placeholder="Event details..."></textarea>
                    </div>
                    <div class="flex justify-end space-x-3 pt-4 border-t">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm">Cancel</button>
                        <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-medium">Post Event & Notify</button>
                    </div>
                </form>
            `;
            m.classList.remove('hidden');
        }

        function saveNewEvent(e) {
            e.preventDefault();
            const title = document.getElementById('evTitle').value;
            db.calendar.push({
                id: Date.now(),
                title: title,
                type: document.getElementById('evType').value,
                start: document.getElementById('evStart').value,
                end: document.getElementById('evEnd').value,
                audience: document.getElementById('evAudience').value,
                desc: document.getElementById('evDesc').value
            });
            db.notifications.unshift({ text: `New Event/Deadline: ${title}`, date: new Date().toISOString().substring(0, 10), read: false });
            closeModal();
            renderCalendar(document.getElementById('mainContentArea'));
            renderNotifications();
        }

        // 12. AUDIT LOGS
        function renderAdminAudit(el) {
            el.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-800 mb-4"><i class="fa-solid fa-shield-halved text-primary mr-2"></i> System Audit Trail & Security Logs</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
                                <tr>
                                    <th class="p-3">Timestamp</th>
                                    <th class="p-3">User</th>
                                    <th class="p-3">Action Performed</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${db.auditLogs.map(log => `
                                    <tr>
                                        <td class="p-3 font-mono text-gray-500">${log.time}</td>
                                        <td class="p-3 font-semibold text-primary">${log.user}</td>
                                        <td class="p-3 text-gray-700">${log.action}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // NOTIFICATIONS BELL DROPDOWN
        function toggleNotifications() {
            const dropdown = document.getElementById('notifDropdown');
            dropdown.classList.toggle('hidden');
        }

        function renderNotifications() {
            const unread = db.notifications.filter(n => !n.read).length;
            document.getElementById('notifBadge').textContent = unread;
            
            const list = document.getElementById('notifList');
            list.innerHTML = db.notifications.map(n => `
                <div class="p-3 hover:bg-gray-50 transition ${n.read ? 'opacity-60' : 'bg-blue-50/40'}">
                    <p class="text-xs text-gray-800 font-medium">${n.text}</p>
                    <span class="text-[10px] text-gray-400 mt-1 block">${n.date}</span>
                </div>
            `).join('');
        }

        function markAllNotifsRead() {
            db.notifications.forEach(n => n.read = true);
            renderNotifications();
        }
    </script>
</body>
</html>
